services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_memories
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_memories"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/travel_memories
      JWT_SECRET: ${JWT_SECRET:-change-me-with-a-long-random-string}
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PUBLIC_URL: http://localhost:8001
    volumes:
      - uploads:/app/uploads
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads: